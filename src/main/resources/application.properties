spring.application.name=crm
server.port=${PORT:4002}

# ── Base de datos ────────────────────────────────────────────────────────────
# Render provee DATABASE_URL directamente — Spring Boot la lee sola
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=1234r

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PostgreSQL usa esquema public por defecto
spring.jpa.properties.hibernate.default_schema=public

# ── JWT ──────────────────────────────────────────────────────────────────────
application.security.jwt.secretKey=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
