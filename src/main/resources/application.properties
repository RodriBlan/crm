spring.application.name=crm
server.port=${PORT:4002}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Render tiene pocos recursos durante el arranque. En el contenedor estas
# opciones se activan para abrir el puerto antes de inicializar JPA.
spring.main.lazy-initialization=${SPRING_LAZY_INITIALIZATION:false}
spring.data.jpa.repositories.bootstrap-mode=${JPA_REPOSITORIES_BOOTSTRAP_MODE:default}

# Base de datos PostgreSQL / Supabase
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_BOOT_METADATA_ACCESS:true}
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=12
spring.jpa.properties.jakarta.persistence.database-minor-version=0
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool acotado para una instancia de Render y Supabase.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Comprime respuestas JSON medianas y grandes.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ── JWT ──────────────────────────────────────────────────────────────────────
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:3600000}
app.auth.registration-enabled=${REGISTRATION_ENABLED:false}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ── Cache local (Caffeine) ───────────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.cache-names=stats,clients,products,categories,sales
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=2m,recordStats
