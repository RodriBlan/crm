spring.application.name=crm
server.port=${PORT:4002}

# Base de datos PostgreSQL / Supabase
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──────────────────────────────────────────────────────────────────────
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:3600000}
app.auth.registration-enabled=${REGISTRATION_ENABLED:false}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
